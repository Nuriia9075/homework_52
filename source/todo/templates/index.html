<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link active" aria-current="page" href="/tasks/">Все задачи</a>
            </div>
        </div>
    </div>
</nav>
<div class="container">
    <div class="border rounded-3 my-4 d-flex justify-content-between p-3">
        <h1>Задачи</h1>
        <a class="btn btn-sm btn-outline-primary fs-5 px-3 lh-lg" href="/tasks/add/">Добавить задачу</a>
    </div>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
            <th scope="col">Задача</th>
            <th scope="col">Статус</th>
            <th scope="col">Подробнее</th>
        </tr>
      </thead>
      <tbody>
      {% for task in tasklist %}
        <tr>
            <td>{{task.title}}</td>
            <td>{{task.get_status_display}}</td>
            <td><a href="/task/{{ task.id }}" class="card-link mt-auto ms-auto">Подробнее</a></td>
        </tr>
      {%endfor%}
      </tbody>
    </table>
</div>
</body>
</html>
