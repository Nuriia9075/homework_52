<div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg"> <!-- modal-lg сделает окно шире для таблицы -->
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addUserModalLabel">Добавление участников в проект</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
                <th scope="col">Имя</th>
            </tr>
          </thead>
          <tbody>
          {% for user in all_users %}
            <tr>
                <td>{{ user.username }}</td>
                <td>
                    <a href="{% url 'todo:add_user' project.pk user.pk %}" class="btn btn-sm btn-outline-success">
                        <span>Добавить</span><i class="fa-solid fa-user-plus ms-2"></i>
                    </a>
                </td>
            </tr>
          {% empty %}
            <tr>
                <td colspan="3" class="text-muted text-center">Нет доступных пользователей для добавления</td>
            </tr>
          {% endfor %}
          </tbody>
        </table></div></div></div></div>
