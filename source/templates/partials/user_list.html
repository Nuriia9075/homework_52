<table class="table table-striped table-hover">
  <thead>
    <tr>
        <th scope="col">Имя</th>
        <th scope="col">Статус</th>
    </tr>
  </thead>
  <tbody>
  {% for user in project.users.all %}
    <tr>
        <td>{{user.username}}</td>
        <td>{{user.status}}</td>
        <td><button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
                    <span>Удалить</span> <i class="fa-solid fa-trash-can"></i>
            </button>
        </td>
        <td><a href="#" class="btn btn-outline-warning">
                <span>Изменить</span><i class="fa-regular fa-pen-to-square ms-2"></i>
            </a>
        </td>
           {% include 'partials/user_delete_modal.html' with user=user %}
    </tr>
        {% empty %}
            <p>Нет пользователей </p>
        {% endfor %}
  </tbody>
</table>
