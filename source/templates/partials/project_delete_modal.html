<div class="modal fade" id="project-{{ project.pk }}-Modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Удаление проекта</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form action="{% url 'delete' project.pk %}" method="POST" id="delete-form-{{ project.pk }}">
        {% csrf_token %}
        <div class="modal-body text-start">
          <p>Вы уверены, что хотите удалить проект "{{ project.name }}"?</p>
        </div>
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" form="delete-form-{{ project.pk }}" class="btn btn-danger">Удалить</button>
      </div>
    </div>
  </div>
</div>
