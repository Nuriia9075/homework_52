{% extends "base.html" %}

{% block content %}
<div class="border rounded-3 my-4 d-flex justify-content-between p-3">
    <h1>Задачи</h1>
    <a class="btn btn-sm btn-outline-primary fs-5 px-3 lh-lg" href="/tasks/add/">Добавить задачу</a>
</div>
<table class="table table-striped table-hover">
  <thead>
    <tr>
        <th scope="col">Задача</th>
        <th scope="col">Статус</th>
        <th scope="col">Подробнее</th>
    </tr>
  </thead>
  <tbody>
  {% for task in tasklist %}
    <tr>
        <td>{{task.title}}</td>
        <td>{{task.get_status_display}}</td>
        <td><a href="/task/{{ task.id }}" class="card-link mt-auto ms-auto">Подробнее</a></td>
    </tr>
  {%endfor%}
  </tbody>
</table>
{% endblock %}
