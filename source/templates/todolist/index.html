{% extends "base.html" %}

{% block content %}
<div class="border rounded-3 my-4 d-flex justify-content-between p-3">
    <h1>Задачи</h1>
    <a class="btn btn-sm btn-outline-primary fs-5 px-3 lh-lg" href="{% url 'task_add' %}">Добавить задачу</a>
</div>
<table class="table table-striped table-hover">
  <thead>
    <tr>
        <th scope="col">Задача</th>
        <th scope="col">Статус</th>
        <th scope="col">Подробнее</th>
    </tr>
  </thead>
  <tbody>
  {% for task in tasklist %}
    <tr>
        <td>{{task.title}}</td>
        <td>{{task.get_status_display}}</td>
        <td><a href="{% url 'task_detail' task.id %}" class="link-secondary text-decoration-none border-bottom border-secondary border-opacity-25 pb-1 link-underline-hover">Подробнее</a></td>
    </tr>
  {%endfor%}
  </tbody>
</table>
{% endblock %}
