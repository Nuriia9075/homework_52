    <div class="modal fade" id="project-{{ project.pk }}-Modal" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="projectModalLabel">Удаление проектра {{ project.name }}</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Вы уверены что хотите удалить проект "{{ project.pk }}"</p>
                    <form action="#" id="delete-form-{{ project.pk }}" method="post">
                        {% csrf_token %}
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" form="delete-form-{{ project.pk }}" class="btn btn-primary">Удалить</button>
                </div>
            </div>
        </div>
    </div>
